<style>
:root{
  --tinta:#060911; --painel:#0E1526; --painel2:#131C31; --borda:#22304E;
  --texto:#D6E2F2; --fraco:#8296B4; --apagado:#465873;
  --azul:#2C7BE5; --verde:#45D964; --ambar:#FFC24B; --vermelho:#FF5B52;
  --mono:'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace;
  --sans:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --larg:1120px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--tinta);color:var(--texto);
  font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.env{max-width:var(--larg);margin:0 auto;padding:0 18px}
a{color:var(--azul)}
:focus-visible{outline:2px solid var(--ambar);outline-offset:3px;border-radius:4px}
code{font-family:var(--mono);font-size:.9em;color:var(--texto)}

header{padding:40px 0 26px;border-bottom:1px solid var(--borda)}
.olho{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--fraco);
  text-transform:uppercase;margin:0 0 12px}
h1{font-family:var(--mono);font-weight:700;letter-spacing:-.03em;line-height:1.05;
  font-size:clamp(2rem,7vw,3.2rem);margin:0 0 10px;text-transform:uppercase}
.resumo{color:var(--fraco);margin:0}
.resumo a{color:var(--azul)}

.barra{position:sticky;top:0;z-index:10;background:rgba(6,9,17,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--borda);padding:12px 0}
.busca{width:100%;padding:12px 14px;font-family:var(--mono);font-size:16px;
  color:var(--texto);background:var(--painel);border:1px solid var(--borda);border-radius:8px}
.busca::placeholder{color:var(--apagado)}
.filtros{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.filtros::-webkit-scrollbar{display:none}
.filtros button{font-family:var(--mono);font-size:12px;white-space:nowrap;cursor:pointer;
  color:var(--fraco);background:var(--painel);border:1px solid var(--borda);
  border-radius:999px;padding:7px 13px}
.filtros button[aria-pressed="true"]{color:var(--tinta);background:var(--azul);
  border-color:var(--azul);font-weight:600}

.aviso{background:var(--painel2);border-left:3px solid var(--ambar);
  padding:12px 14px;margin:14px 0;border-radius:0 8px 8px 0;font-size:14.5px}
.aviso b{color:var(--ambar)}

section{padding:26px 0 4px}
h2{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--fraco);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--borda)}

.peca{background:var(--painel);border:1px solid var(--borda);border-radius:10px;
  padding:13px 15px;margin-bottom:9px}
.peca-topo{display:flex;gap:12px;align-items:baseline;justify-content:space-between}
.peca-nome{font-weight:600;line-height:1.3}
.peca-qtd{font-family:var(--mono);font-size:13px;color:var(--verde);white-space:nowrap}
.peca-id{font-family:var(--mono);font-size:11.5px;color:var(--apagado);margin-top:3px}
.peca-campos{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.campo{font-family:var(--mono);font-size:11.5px;color:var(--fraco);
  background:var(--painel2);border:1px solid var(--borda);border-radius:5px;padding:3px 8px}
.peca-notas{margin-top:9px;font-size:14px;color:var(--fraco);
  border-top:1px solid var(--borda);padding-top:9px;white-space:pre-line}
.peca-desc{margin-top:6px;font-size:14.5px;color:var(--fraco)}
.vazio{color:var(--apagado);font-family:var(--mono);font-size:13px;padding:26px 0}

/* Etiquetas de estado. A cor carrega significado: verde e o que esta resolvido,
   ambar o que exige atencao, apagado o que ainda e so intencao. */
.selo{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  border-radius:5px;padding:3px 8px;white-space:nowrap;border:1px solid}
.selo-ideia{color:var(--apagado);border-color:var(--borda);background:var(--painel2)}
.selo-especificado{color:var(--azul);border-color:var(--azul);background:rgba(44,123,229,.1)}
.selo-montado{color:var(--verde);border-color:var(--verde);background:rgba(69,217,100,.1)}
.selo-publicado{color:var(--ambar);border-color:var(--ambar);background:rgba(255,194,75,.1)}
.selo-alta{color:var(--vermelho);border-color:var(--vermelho);background:rgba(255,91,82,.1)}
.selo-media{color:var(--fraco);border-color:var(--borda);background:var(--painel2)}
.selo-baixa{color:var(--apagado);border-color:var(--borda);background:var(--painel2)}

.falta{margin-top:9px;font-size:14px;border-top:1px solid var(--borda);padding-top:9px}
.falta-nada{color:var(--verde)}
.falta-lista{color:var(--ambar)}
.falta code{color:inherit}

.preco{font-family:var(--mono);font-size:13px;color:var(--ambar);white-space:nowrap}
.total{font-family:var(--mono);font-size:13px;color:var(--fraco);margin:0 0 12px}

footer{border-top:1px solid var(--borda);margin-top:36px;padding:22px 0 40px;
  font-family:var(--mono);font-size:12px;color:var(--apagado)}
</style>
</head>
<body>
<header class="env">
  <p class="olho">bancada de eletrônica</p>
  <h1>hw-laboratorio</h1>
  <p class="resumo">85 componentes distintos, 991 peças. 14 projetos no backlog, 18 itens para comprar. <a href="https://github.com/henriquemattosesilva/hw-laboratorio">repositório</a></p>
</header>

<div class="barra">
  <div class="env">
    <input class="busca" id="busca" type="search" autocomplete="off"
           placeholder="buscar por nome, id, interface ou nota…"
           aria-label="Buscar">
    <div class="filtros" id="filtros"></div>
  </div>
</div>

<main class="env" id="lista"></main>

<footer class="env">
  gerado por ferramentas/gerar-pagina.py — não editar à mão
</footer>

<script type="application/json" id="dados">{"titulos": {"placas": "Placas", "sensores": "Sensores", "displays": "Displays", "atuadores": "Atuadores", "comunicacao": "Comunicação", "energia": "Energia", "passivos": "Passivos", "prototipagem": "Prototipagem", "diversos": "Diversos"}, "componentes": [{"id": "arduino-nano", "nome": "Arduino Nano V3.0 ATmega328 5V", "qtd": 1, "familia": "placas", "tensao": "5 V lógico", "interface": "mini-USB; 14 digitais (6 com PWM), 8 analógicas", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Mesmo micro do Uno, no mesmo relógio, num terço do tamanho.\nA6 e A7 só leem analógico: não servem como pino digital.\nPlaca de clone com CH340 costuma precisar de driver no Windows; se não aparecer porta COM, é isso.\n"}, {"id": "arduino-uno", "nome": "Arduino Uno R3", "qtd": 1, "familia": "placas", "tensao": "5 V lógico; alimentação 7–12 V no jack ou pela USB", "interface": "USB-B; 14 digitais (6 com PWM), 6 analógicas", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "ATmega328P a 16 MHz: 32 KB de flash (menos o bootloader), 2 KB de RAM.\nA RAM é o que acaba primeiro — cada string literal no código come dela.\nSem rádio de espécie alguma.\nO regulador de 3,3 V da placa entrega uns 50 mA, não mais.\n"}, {"id": "esp8266-nodemcu", "nome": "Módulo ESP8266 ESP-12E CH340G NodeMCU", "qtd": 1, "familia": "placas", "tensao": "3,3 V nos pinos; alimentação pela micro-USB", "interface": "Wi-Fi 2,4 GHz; sem Bluetooth", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Os pinos NÃO são tolerantes a 5 V. Ligar direto num sensor de 5 V queima.\nUm único pino analógico, A0, e no chip ele lê até 1,0 V — a placa tem divisor para aceitar 3,3 V.\nPara deep sleep é preciso ligar GPIO16 (D0) ao RST com um fio; sem isso a placa dorme e não acorda.\nD3, D4 e D8 mandam no boot: nível errado neles na energização impede a placa de subir.\n"}, {"id": "ldr-modulo", "nome": "Módulo Sensor de Luminosidade LDR", "qtd": 1, "familia": "sensores", "tensao": "3,3 V a 5 V", "interface": "digital com limiar por trimpot; alguns trazem AO também", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "O módulo responde \"está claro ou escuro?\", não \"quanto de luz?\".\nPara medir nível, usar o LDR solto num divisor.\n"}, {"id": "pir-dypme003", "nome": "Módulo Sensor de Presença e Movimento PIR DYP-ME003", "qtd": 1, "familia": "sensores", "tensao": "4,5 V a 20 V de alimentação; saída em 3,3 V", "interface": "digital, nível alto enquanto detecta", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Precisa de 30 a 60 s parado depois de energizar para calibrar o fundo.\nMovimento nesse tempo dá alarme falso.\nOs dois trimpots ajustam sensibilidade e tempo de retenção; o jumper escolhe entre disparo único e redisparo contínuo.\nComo a saída é 3,3 V, serve tanto para Arduino quanto para ESP.\n"}, {"id": "sensor-chuva", "nome": "Sensor de Chuva", "qtd": 1, "familia": "sensores", "tensao": "3,3 V a 5 V", "interface": "analógico (AO) e digital com limiar por trimpot (DO)", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Mesma armadilha do higrômetro: a placa coletora corrói energizada.\nAlimentar só na medição.\n"}, {"id": "tcs34725", "nome": "Sensor de Cor RGB TCS34725 com Filtro IR", "qtd": 1, "familia": "sensores", "tensao": "3,3 V no chip; o módulo costuma aceitar 5 V", "interface": "I2C", "endereco": "0x29", "biblioteca": "Adafruit_TCS34725", "datasheet": null, "compra": null, "notas": "A quantidade veio em branco no export do Notion; anotado 1 por suposição.\nCONFERIR NA GAVETA.\nTraz LED branco embutido: cor lida sem acender o LED depende da luz do ambiente e muda de hora em hora.\nO filtro de infravermelho é o que faz esse sensor acertar cor onde os baratos erram.\n"}, {"id": "hc-sr04", "nome": "Sensor de Distância Ultrassônico HC-SR04", "qtd": 2, "familia": "sensores", "tensao": "5 V", "interface": "digital: pulso de 10 µs no trigger, largura do echo é a distância", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "O pino echo devolve 5 V. Ligar direto num ESP8266 ou ESP32 exige divisor.\nFaixa útil de 2 cm a 4 m, e a leitura piora muito em superfície macia, em pano, e em qualquer coisa inclinada — o eco volta para outro lugar.\n"}, {"id": "sensor-cardiaco", "nome": "Sensor de Frequência Cardíaca", "qtd": 1, "familia": "sensores", "tensao": null, "interface": "analógico, provavelmente", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "O nome no Notion é genérico e não identifica o modelo. CONFERIR A SERIGRAFIA na plaquinha antes de planejar projeto com ele: se for um Pulse Sensor, é fotopletismografia analógica com biblioteca própria; se for MAX30102, é I2C e outra história inteira.\n"}, {"id": "ldr-5mm", "nome": "Sensor de Luminosidade LDR 5mm", "qtd": 13, "familia": "sensores", "tensao": null, "interface": "analógico — é um resistor, precisa de divisor", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Sozinho não mede nada: entra num divisor com um resistor fixo (10 kΩ é o valor comum) e o meio do divisor vai para a entrada analógica.\nResistência cai com a luz — claro dá tensão diferente de escuro, e qual dos dois depende de qual perna do divisor ele ocupa.\n"}, {"id": "bmp280", "nome": "Sensor de Pressão e Temperatura BMP280", "qtd": 1, "familia": "sensores", "tensao": "3,3 V no chip; o módulo com regulador aceita 5 V", "interface": "I2C (também faz SPI)", "endereco": "0x76, ou 0x77 conforme o pino SDO", "biblioteca": "Adafruit_BMP280", "datasheet": null, "compra": null, "notas": "Não mede umidade. O que mede é o BME280, fisicamente quase idêntico e com o mesmo endereço — comprar um pensando no outro é o erro clássico.\nA pressão serve de altímetro, com uns 10 cm de resolução.\n"}, {"id": "ky-038", "nome": "Sensor de Som Microfone KY-038", "qtd": 1, "familia": "sensores", "tensao": "3,3 V a 5 V", "interface": "analógico (AO) e digital com limiar por trimpot (DO)", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Detecta que houve som acima de um limiar. Não reconhece nota, palavra nem frequência — para isso seria preciso amostrar o AO rápido e fazer FFT.\nO trimpot é sensível: o ajuste útil fica numa faixa estreita.\n"}, {"id": "ds18b20", "nome": "Sensor de Temperatura a Prova D’água DS18B20", "qtd": 2, "familia": "sensores", "tensao": "3,0 V a 5,5 V", "interface": "1-Wire", "endereco": null, "biblioteca": "OneWire + DallasTemperature", "datasheet": null, "compra": null, "notas": "Precisa de pull-up de 4,7 kΩ entre dados e VCC. Sem ele o sensor não responde, e o sintoma é leitura de -127.\nVários sensores dividem o mesmo pino: cada um tem endereço de 64 bits gravado de fábrica.\nOs dois aqui são a versão em sonda de aço, que serve para líquido e solo.\n"}, {"id": "lm35", "nome": "Sensor de Temperatura LM35DZ", "qtd": 1, "familia": "sensores", "tensao": "4 V a 30 V", "interface": "analógico, 10 mV por °C", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Não mede abaixo de 0 °C sem circuito extra — 0 °C é 0 V, e não há como ir mais baixo com alimentação simples.\nCom referência de 5 V, cada passo do conversor vale 0,49 °C, o que é ruim.\nanalogReference(INTERNAL) no ATmega põe a referência em 1,1 V e melhora a resolução para 0,11 °C.\n"}, {"id": "higrometro-solo", "nome": "Sensor de Umidade do Solo Higrômetro", "qtd": 1, "familia": "sensores", "tensao": "3,3 V a 5 V", "interface": "analógico (AO) e digital com limiar por trimpot (DO)", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Sonda resistiva: ela corrói quando fica energizada dentro da terra, e em poucas semanas o valor sai errado. Alimentar por um pino de saída e ligar só no momento da leitura resolve boa parte disso.\nO que dura de verdade é o sensor capacitivo, que não temos.\n"}, {"id": "dht22", "nome": "Sensor de Umidade e Temperatura AM3202 DHT22", "qtd": 1, "familia": "sensores", "tensao": "3,3 V a 5 V", "interface": "1 fio proprietário (não é o 1-Wire da Dallas)", "endereco": null, "biblioteca": "DHT sensor library (Adafruit)", "datasheet": null, "compra": null, "notas": "Uma leitura a cada 2 s, no máximo. Ler mais rápido devolve o valor anterior sem avisar que é velho.\nPrecisa de pull-up de 10 kΩ no pino de dados quando o módulo não traz um.\n"}, {"id": "touch-ttp223b", "nome": "Sensor Touch Capacitivo TTP223B", "qtd": 1, "familia": "sensores", "tensao": "2,0 V a 5,5 V", "interface": "digital", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Funciona através de acrílico ou plástico fino, o que serve bem para case fechado sem furo de botão.\nOs pares de solda A e B na traseira trocam entre pulso enquanto encostado e alternância a cada toque.\n"}, {"id": "display-7seg", "nome": "Display 7 Segmentos 1 Dígito Vermelho Cátodo Comum CD4511", "qtd": 2, "familia": "displays", "tensao": "5 V", "interface": "4 pinos via CD4511 (BCD), ou 7 pinos direto", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "O CD4511 traduz 4 bits em dígito, economizando três pinos por display.\nEle só serve para CÁTODO COMUM, que é o caso destes.\nContinua precisando de resistor em cada segmento — o CD4511 não limita corrente.\n"}, {"id": "lcd-16x2", "nome": "Display LCD 16x2", "qtd": 1, "familia": "displays", "tensao": "5 V", "interface": "paralelo HD44780; 6 pinos no modo de 4 bits", "endereco": null, "biblioteca": "LiquidCrystal", "datasheet": null, "compra": null, "notas": "Precisa de um potenciômetro de 10 kΩ no pino V0 para o contraste. Sem ele a tela fica toda preta ou toda apagada, e parece defeito.\nNão tem adaptador I2C aqui, então gasta 6 pinos de verdade.\nJá é o display do receptor no hw-codigo-morse.\n"}, {"id": "nokia-5110", "nome": "Display LCD Nokia 5110", "qtd": 1, "familia": "displays", "tensao": "3,3 V — NÃO é tolerante a 5 V", "interface": "SPI (PCD8544), 84 × 48 pixels", "endereco": null, "biblioteca": "Adafruit_PCD8544 + Adafruit_GFX", "datasheet": null, "compra": null, "notas": "Ligar num Uno de 5 V sem divisor de tensão nos sinais mata o controlador.\nCom ESP8266 vai direto, que é onde ele brilha.\nAo contrário do 16x2, desenha gráfico e fonte de tamanhos diferentes.\n"}, {"id": "matriz-8x8-bicolor", "nome": "Display LED Matriz de LED 8x8 Bicolor (Verde/Vermelho)", "qtd": 1, "familia": "displays", "tensao": null, "interface": "matriz crua de 24 pinos — sem driver", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Esta é a matriz nua, sem MAX7219. Acender tudo ao mesmo tempo é impossível: precisa de multiplexação por software e de resistor em cada coluna.\nDá muito mais trabalho que a do MAX7219 — em troca, faz duas cores.\n"}, {"id": "matriz-max7219", "nome": "Módulo Matriz de LED 8×8 com MAX7219", "qtd": 1, "familia": "displays", "tensao": "5 V", "interface": "SPI", "endereco": null, "biblioteca": "MD_MAX72XX, ou LedControl", "datasheet": null, "compra": null, "notas": "O MAX7219 faz a multiplexação sozinho: o micro só manda o que mostrar.\nOs módulos são encadeáveis em série, então dá para virar painel de texto correndo comprando mais.\n"}, {"id": "laser-diodo", "nome": "Diodo Laser 5mW 5V", "qtd": 1, "familia": "atuadores", "tensao": "5 V", "interface": "digital", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "O componente solto, sem plaquinha. Diodo laser precisa de corrente controlada — ligar direto na fonte queima. Usar com resistor limitador, ou preferir o módulo.\nO nome vinha como \"Dioso Laser\" no export do Notion; erro de digitação corrigido na migração.\n"}, {"id": "servo-sg90", "nome": "Micro Servo 9g SG90", "qtd": 2, "familia": "atuadores", "tensao": "4,8 V a 6 V", "interface": "PWM de 50 Hz; pulso de 1 a 2 ms define o ângulo", "endereco": null, "biblioteca": "Servo", "datasheet": null, "compra": null, "notas": "O pico de corrente ao começar a girar derruba o 5 V da USB e reinicia a placa. Com dois servos isso é praticamente certo: fonte separada, terra em comum com o Arduino.\nCurso de mais ou menos 180°, e forçar contra o batente queima a engrenagem.\nA biblioteca Servo usa o Timer1 no Uno, o mesmo que a RH_ASK do rádio 433 MHz quer — os dois juntos brigam.\n"}, {"id": "buzzer-ativo", "nome": "Módulo Buzzer Ativo P15", "qtd": 1, "familia": "atuadores", "tensao": "3,3 V a 5 V", "interface": "digital — nível liga, não precisa de tone()", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Ativo quer dizer que o oscilador está dentro: toca uma nota só, e o código apenas liga e desliga. Para tocar melodia seria preciso um passivo, que não temos.\nA polaridade de acionamento NÃO foi verificada. Vários módulos P15 tocam com nível BAIXO. Se apitar parado e calar ao acionar, é isso.\nO hw-codigo-morse assume acionamento em nível ALTO e registra isso como não verificado.\n"}, {"id": "laser-modulo", "nome": "Módulo Diodo Laser 5mW 5V 650nm 6mm", "qtd": 1, "familia": "atuadores", "tensao": "5 V", "interface": "digital", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Já vem com o resistor limitador na plaquinha: é ligar e acender.\nNão olhar para o feixe, e não apontar para ninguém. 5 mW em 650 nm passa do que o reflexo de piscar protege.\n"}, {"id": "rele-1ch", "nome": "Módulo Relé 5V 1 canal", "qtd": 2, "familia": "atuadores", "tensao": "bobina de 5 V; entrada de sinal aceita 3,3 V na maioria", "interface": "digital — quase sempre acionado em nível BAIXO", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "A maioria destes módulos liga com LOW e desliga com HIGH. O sintoma de ter assumido errado é o relé fechar sozinho ao ligar a placa, antes de o código rodar.\nDo lado de carga é rede elétrica: separar fisicamente do lado de baixa tensão, e não deixar trilha de 127/220 V passando por baixo da protoboard.\n"}, {"id": "rele-2ch", "nome": "Módulo Relé 5V 2 canais", "qtd": 1, "familia": "atuadores", "tensao": "bobina de 5 V", "interface": "dois pinos digitais — quase sempre acionados em nível BAIXO", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Duas bobinas ligadas ao mesmo tempo puxam mais do que a USB do Arduino entrega com folga. Alimentar o módulo por fora e usar o jumper de separação, quando ele existe.\n"}, {"id": "rfid-cartao", "nome": "Cartão RFID Programável Mifare 13,56MHz", "qtd": 8, "familia": "comunicacao", "tensao": null, "interface": "13,56 MHz Mifare Classic 1K", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "1 KB dividido em 16 setores. Cada setor tem duas chaves; a de fábrica é FF FF FF FF FF FF.\nGravar chave nova sem anotar deixa o cartão inutilizável — não há como voltar atrás.\n"}, {"id": "controle-ir", "nome": "Controle Remoto Infravermelho 38KHz", "qtd": 1, "familia": "comunicacao", "tensao": null, "interface": "infravermelho 38 kHz, protocolo NEC na maioria", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Cada tecla manda um código de 32 bits. O jeito de descobrir é rodar o exemplo de dump da IRremote e anotar o que sai — não existe tabela confiável para os controles genéricos.\nVem com pilha CR2032 e quase sempre com uma película plástica que precisa ser puxada antes de funcionar.\n"}, {"id": "ir-emissor", "nome": "Módulo Emissor Infravermelho", "qtd": 1, "familia": "comunicacao", "tensao": "3,3 V a 5 V", "interface": "digital, modulado em 38 kHz por software", "endereco": null, "biblioteca": "IRremote", "datasheet": null, "compra": null, "notas": "O LED emite; quem gera os 38 kHz é a biblioteca, chaveando o pino.\nO alcance do módulo pronto é curto, porque a corrente é limitada por resistor pequeno. Com transistor e mais corrente vai bem mais longe.\n"}, {"id": "mfrc522", "nome": "Módulo Leitor Rfid MFRC522 Mifare 13,56MHz", "qtd": 1, "familia": "comunicacao", "tensao": "3,3 V — os pinos não são para 5 V", "interface": "SPI", "endereco": null, "biblioteca": "MFRC522", "datasheet": null, "compra": null, "notas": "Lê 13,56 MHz (Mifare). NÃO lê tag de 125 kHz, que é a de portaria e crachá antigo, e é fisicamente parecida.\nCom Uno de 5 V muita gente liga direto e funciona, mas está fora de especificação: o certo é divisor nos sinais que vão do Uno para o módulo.\nAlimentar em 3,3 V — os 5 V queimam.\n"}, {"id": "ir-rx-ky022", "nome": "Módulo Receptor Infravermelho KY-022 38KHz", "qtd": 1, "familia": "comunicacao", "tensao": "3,3 V a 5 V", "interface": "digital, saída ativa em nível BAIXO", "endereco": null, "biblioteca": "IRremote", "datasheet": null, "compra": null, "notas": "É o mesmo receptor do VS1838B já numa plaquinha com os pinos marcados, o que evita o risco de inverter a alimentação.\n"}, {"id": "rf433-rx", "nome": "Módulo Receptor Rádio Frequência 433MHz AM", "qtd": 1, "familia": "comunicacao", "tensao": "5 V", "interface": "digital, um pino de dados", "endereco": null, "biblioteca": "RadioHead RH_ASK, ou RCSwitch", "datasheet": null, "compra": null, "notas": "Os receptores baratos são superregenerativos: pegam ruído o tempo todo e o alcance decepciona. O superheteródino custa pouco mais e é outro mundo.\nTambém precisa dos 17,3 cm de antena.\nTem quatro pinos, dois deles DATA ligados internamente — usar qualquer um.\nVista de cima a ordem é VCC DATA DATA GND; a serigrafia fica no verso e lá se lê o inverso.\nTem peça Fritzing própria em fritzing/rf433-rx/, que o core do programa não traz.\n"}, {"id": "rf433-tx", "nome": "Módulo Transmissor Rádio Frequência 433MHz AM", "qtd": 1, "familia": "comunicacao", "tensao": "3 V a 12 V — quanto mais tensão, mais alcance", "interface": "digital, um pino de dados (ASK/OOK)", "endereco": null, "biblioteca": "RadioHead RH_ASK, ou RCSwitch", "datasheet": null, "compra": null, "notas": "Sem antena o alcance é de centímetros. Um fio reto de 17,3 cm é um quarto de onda em 433,92 MHz e resolve, sem custo.\nÉ meio-duplex e sem confirmação: o transmissor não sabe se chegou. Quem quer confiabilidade repete a mensagem.\nA serigrafia varia entre versões — conferir DATA / VCC / GND na plaquinha antes de ligar.\nJá usado no hw-codigo-morse.\nTem peça Fritzing própria em fritzing/rf433-tx/, que o core do programa não traz.\n"}, {"id": "ir-rx-vs1838b", "nome": "Receptor Infravermelho VS1838B 38Khz", "qtd": 1, "familia": "comunicacao", "tensao": "2,7 V a 5,5 V", "interface": "digital, saída ativa em nível BAIXO", "endereco": null, "biblioteca": "IRremote", "datasheet": null, "compra": null, "notas": "Em repouso a saída fica em nível alto e cai quando chega portadora. Quem espera o contrário acha que está quebrado.\nÉ o componente solto; a ordem dos três pinos varia por fabricante e ligar invertido queima. Conferir contra o datasheet do VS1838B.\n"}, {"id": "sensor-obstaculo-ir", "nome": "Sensor de Obstáculo Infravermelho", "qtd": 2, "familia": "comunicacao", "tensao": "3,3 V a 5 V", "interface": "digital, nível BAIXO quando detecta", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Emissor e receptor no mesmo módulo: mede reflexão, não distância. A distância de disparo é ajustada no trimpot, de 2 a 30 cm.\nSuperfície preta absorve o infravermelho e não é detectada. Sol direto cega o sensor. Os dois são limitação física, não defeito.\n"}, {"id": "rfid-chaveiro", "nome": "Tag Chaveiro RFID Programável Mifare 13,56MHz", "qtd": 1, "familia": "comunicacao", "tensao": null, "interface": "13,56 MHz Mifare Classic 1K", "endereco": null, "biblioteca": null, "datasheet": null, "compra": null, "notas": "Mesma coisa do cartão, em formato de chaveiro."}, {"id": "chave-ss-sk22g50", "nome": "Chave SS 2 Posições SK22G50", "qtd": 3, "familia": "passivos", me": "Sensor de umidade do solo capacitivo v1.2", "qtd": 1, "motivo": ["horta-monitorada"], "prioridade": "alta", "status": "pesquisando", "link": null, "preco": 25.0}, {"id": "reed-switch", "nome": "Reed switch com ímã (sensor magnético de porta)", "qtd": 2, "motivo": ["sensor-porta"], "prioridade": "alta", "status": "pesquisando", "link": null, "preco": 12.0}, {"id": "matriz-max7219-4", "nome": "Módulo Matriz de LED MAX7219 4 em 1 (32x8)", "qtd": 1, "motivo": ["relogio-mesa"], "prioridade": "baixa", "status": "pesquisando", "link": null, "preco": 45.0}, {"id": "ds3231", "nome": "Real Time Clock RTC DS3231 com compensação de temperatura", "qtd": 1, "motivo": ["relogio-mesa"], "prioridade": "media", "status": "pesquisando", "link": null, "preco": 20.0}, {"id": "motor-dc-reducao", "nome": "Motor DC com caixa de redução (TT ou N20 6V)", "qtd": 2, "motivo": ["tanque-rc"], "prioridade": "baixa", "status": "pesquisando", "link": null, "preco": 30.0}, {"id": "driver-drv8833", "nome": "Driver de motor duplo DRV8833 (ou TB6612FNG)", "qtd": 1, "motivo": ["tanque-rc"], "prioridade": "baixa", "status": "pesquisando", "link": null, "preco": 25.0}, {"id": "chassi-esteira", "nome": "Chassi com esteiras para robô", "qtd": 1, "motivo": ["tanque-rc"], "prioridade": "baixa", "status": "pesquisando", "link": null, "preco": 120.0}, {"id": "joystick-2eixos", "nome": "Módulo joystick analógico 2 eixos com botão", "qtd": 1, "motivo": ["tanque-rc"], "prioridade": "baixa", "status": "pesquisando", "link": null, "preco": 15.0}], "alertas": []}</script>
<script>
const DADOS = JSON.parse(document.getElementById('dados').textContent);
const lista = document.getElementById('lista');
const busca = document.getElementById('busca');
const filtros = document.getElementById('filtros');
let abaAtiva = 'tudo';

const familias = Object.keys(DADOS.titulos)
  .filter(f => DADOS.componentes.some(c => c.familia === f));
const abas = [
  ['tudo', 'Tudo'],
  ...(DADOS.projetos.length ? [['projetos', 'Projetos']] : []),
  ...(DADOS.compras.length ? [['compras', 'Compras']] : []),
  ...familias.map(f => [f, DADOS.titulos[f]]),
];

for (const [chave, rotulo] of abas) {
  const b = document.createElement('button');
  b.textContent = rotulo;
  b.setAttribute('aria-pressed', String(chave === 'tudo'));
  b.onclick = () => {
    abaAtiva = chave;
    [...filtros.children].forEach((o, i) =>
      o.setAttribute('aria-pressed', String(abas[i][0] === chave)));
    desenhar();
  };
  filtros.appendChild(b);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g,
    m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}

function combina(campos, termo) {
  if (!termo) return true;
  const alvo = campos.filter(Boolean).join(' ').toLowerCase();
  return termo.split(/\s+/).every(p => alvo.includes(p));
}

function moeda(v) {
  return 'R$ ' + v.toFixed(2).replace('.', ',');
}

function secao(titulo, cartoes, extra) {
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${esc(titulo)} — ${cartoes.length}</h2>` + (extra || '');
  cartoes.forEach(c => sec.appendChild(c));
  return sec;
}

function cartaoComponente(c) {
  const el = document.createElement('article');
  el.className = 'peca';
  const campos = [c.tensao, c.interface, c.endereco, c.biblioteca]
    .filter(Boolean).map(v => `<span class="campo">${esc(v)}</span>`).join('');
  el.innerHTML =
    `<div class="peca-topo"><div><div class="peca-nome">${esc(c.nome)}</div>` +
    `<div class="peca-id">${esc(c.id)}</div></div>` +
    `<div class="peca-qtd">${c.qtd}×</div></div>` +
    (campos ? `<div class="peca-campos">${campos}</div>` : '') +
    (c.notas ? `<div class="peca-notas">${esc(c.notas.trim())}</div>` : '');
  return el;
}

function cartaoProjeto(p) {
  const el = document.createElement('article');
  el.className = 'peca';
  const pecas = Object.entries(p.precisa)
    .map(([id, n]) => `<span class="campo">${esc(id)} ×${n}</span>`).join('');
  const falta = p.falta.length
    ? `<div class="falta falta-lista">falta: ` +
      p.falta.map(i => `<code>${esc(i)}</code>`).join(', ') + `</div>`
    : `<div class="falta falta-nada">o inventário cobre inteiro</div>`;
  el.innerHTML =
    `<div class="peca-topo"><div><div class="peca-nome">${esc(p.titulo)}</div>` +
    `<div class="peca-id">${esc(p.id)}</div></div>` +
    `<span class="selo selo-${esc(p.status)}">${esc(p.status)}</span></div>` +
    `<div class="peca-desc">${esc(p.descricao)}</div>` +
    (p.repositorio
      ? `<div class="peca-desc"><a href="${esc(p.repositorio)}">${esc(p.repositorio)}</a></div>`
      : '') +
    (pecas ? `<div class="peca-campos">${pecas}</div>` : '') +
    falta;
  return el;
}

function cartaoCompra(i) {
  const el = document.createElement('article');
  el.className = 'peca';
  const motivo = i.motivo.length
    ? `<div class="falta">para: ` +
      i.motivo.map(m => `<code>${esc(m)}</code>`).join(', ') + `</div>`
    : '';
  const total = i.preco ? moeda(i.preco * i.qtd) : '';
  el.innerHTML =
    `<div class="peca-topo"><div><div class="peca-nome">${esc(i.nome)}</div>` +
    `<div class="peca-id">${esc(i.id)} · ${i.qtd}×</div></div>` +
    `<div class="preco">${total}</div></div>` +
    `<div class="peca-campos">` +
    `<span class="selo selo-${esc(i.prioridade)}">${esc(i.prioridade)}</span>` +
    `<span class="campo">${esc(i.status)}</span>` +
    (i.link ? `<a class="campo" href="${esc(i.link)}">loja</a>` : '') +
    `</div>` + motivo;
  return el;
}

function desenhar() {
  const termo = busca.value.trim().toLowerCase();
  lista.textContent = '';

  for (const a of DADOS.alertas) {
    const el = document.createElement('div');
    el.className = 'aviso';
    el.innerHTML = a;
    lista.appendChild(el);
  }

  let mostrados = 0;

  if (abaAtiva === 'tudo' || abaAtiva === 'projetos') {
    const itens = DADOS.projetos.filter(p => combina(
      [p.titulo, p.id, p.descricao, p.status, ...Object.keys(p.precisa)], termo));
    if (itens.length) {
      lista.appendChild(secao('Projetos', itens.map(cartaoProjeto)));
      mostrados += itens.length;
    }
  }

  if (abaAtiva === 'tudo' || abaAtiva === 'compras') {
    const itens = DADOS.compras.filter(i => combina(
      [i.nome, i.id, i.prioridade, i.status, ...i.motivo], termo));
    if (itens.length) {
      const soma = itens.reduce((t, i) => t + (i.preco || 0) * i.qtd, 0);
      const alta = itens.filter(i => i.prioridade === 'alta')
        .reduce((t, i) => t + (i.preco || 0) * i.qtd, 0);
      const resumo = `<p class="total">soma do que está à vista: ${moeda(soma)} — ` +
        `só a prioridade alta: ${moeda(alta)}</p>`;
      lista.appendChild(secao('Lista de compras', itens.map(cartaoCompra), resumo));
      mostrados += itens.length;
    }
  }

  for (const familia of familias) {
    if (abaAtiva !== 'tudo' && abaAtiva !== familia) continue;
    const itens = DADOS.componentes.filter(c => c.familia === familia && combina(
      [c.nome, c.id, c.interface, c.tensao, c.biblioteca, c.endereco, c.notas], termo));
    if (!itens.length) continue;
    lista.appendChild(secao(DADOS.titulos[familia], itens.map(cartaoComponente)));
    mostrados += itens.length;
  }

  if (!mostrados) {
    const v = document.createElement('p');
    v.className = 'vazio';
    v.textContent = 'nada encontrado';
    lista.appendChild(v);
  }
}

busca.addEventListener('input', desenhar);
desenhar();
</script>
