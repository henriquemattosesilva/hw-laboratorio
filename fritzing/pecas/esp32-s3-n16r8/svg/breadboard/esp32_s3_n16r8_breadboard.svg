<?xml version="1.0" encoding="UTF-8"?>
<!-- ESP32-S3 N16R8 (ESP32-S3-WROOM-1, USB-C dupla), vista de cima. Placa de 57 x 28 mm, conectores na borda de cima e baixo.
     72 unidades por polegada: 1 mm = 2,834646 u e o passo de 0,1" = 7,2 u.
     Furo de encaixe, sem pino saindo: e assim que o fio entra. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="2.24409in" height="1.10236in" viewBox="0 0 161.575 79.370">
 <g id="breadboard">
