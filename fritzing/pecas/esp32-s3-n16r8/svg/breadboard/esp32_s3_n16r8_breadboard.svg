        fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Ornamento. A placa esta deitada: o modulo e a antena na ponta esquerda, as
       duas USB-C na direita. Na foto ela esta em pe, com as USB embaixo.

       USB e COM estao na serigrafia do VERSO. Vieram para a vista de cima de
       proposito: e aqui que se decide em qual porta plugar, e sao portas
       diferentes — COM passa pelo conversor serial, USB e a nativa do S3. -->

